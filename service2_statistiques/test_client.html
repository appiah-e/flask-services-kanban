<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test API Flask</title>
</head>

<body>

<h2>Test de l'API Flask</h2>

<!-- ===================== TEST /describe ===================== -->
<button onclick="testDescribe()">Tester describe</button>

<!-- ===================== TEST /correlation ===================== -->
<button onclick="testCorrelation()">Tester correlation</button>

<pre id="result">Résultat ici...</pre>

<script>

function testDescribe() {

    // Test de la route /stats/describe
    fetch("http://127.0.0.1:5002/stats/describe", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            data: [1, 2, 3, 4, 5]
        })
    })

    .then(response => response.json())
    .then(data => {
        document.getElementById("result").innerText =
            JSON.stringify(data, null, 2);
    })

    .catch(error => {
        document.getElementById("result").innerText =
            "Erreur describe : " + error;
    });
}


// ===================== TEST CORRELATION =====================
function testCorrelation() {

    // Test de la route /stats/correlation
    fetch("http://127.0.0.1:5002/stats/correlation", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            x: [1, 2, 3, 4, 5],
            y: [2, 4, 6, 8, 10]
        })
    })

    .then(response => response.json())
    .then(data => {
        document.getElementById("result").innerText =
            JSON.stringify(data, null, 2);
    })

    .catch(error => {
        document.getElementById("result").innerText =
            "Erreur correlation : " + error;
    });
}

</script>

</body>
</html>
